name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: auth0 --version
          gitref: ${{ github.head_ref || github.ref_name }} # workaround for https://github.com/asdf-vm/asdf/issues/2131
          version: "1.21.0" # latest version as of 2025-10-09, workaround for https://github.com/asdf-vm/asdf/issues/2193
